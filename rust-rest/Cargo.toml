[package]
name = "rust-rest"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.0"
actix-rt = "2.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonwebtoken = "8.1"
env_logger = "0.10"
log = "0.4"
chrono = "0.4"
uuid = { version = "1.0", features = ["v4"] }

